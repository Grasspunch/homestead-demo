<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our shop · Contact us</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f4ef; color: #24372b; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 640px; margin: auto; padding: 48px 24px; }
    h1 { font-size: 2.4rem; line-height: 1.2; }
    form { padding: 24px; background: white; border: 1px solid #d3d9d0; border-radius: 12px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #718275; border-radius: 6px; font: inherit; }
    textarea { resize: vertical; }
    button { margin-top: 20px; padding: 12px 20px; border: 0; border-radius: 6px; background: #28543b; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #ad781b; outline-offset: 3px; }
    #status { margin-bottom: 0; }
    #status[data-state="error"] { color: #a02121; }
    #status[data-state="success"] { color: #28543b; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to our shop</h1>
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Get in touch</h2>
      <p>Have a question? Send the shop owner a message and we'll reply by email.</p>
      <noscript><p>Please enable JavaScript to send a message using this form.</p></noscript>
      <form id="contact-form">
        <p>All fields are required.</p>
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" maxlength="100" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" maxlength="5000" required></textarea>
        <button type="submit" disabled>Send message</button>
        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('contact-form');
    const button = form.querySelector('button');
    const status = document.getElementById('status');
    button.disabled = false;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = 'Sending…';
      status.dataset.state = '';
      status.textContent = 'Sending your message…';
      try {
        const response = await fetch('/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const result = await response.json();
        status.dataset.state = response.ok ? 'success' : 'error';
        status.textContent = result.message;
        if (response.ok) form.reset();
      } catch {
        status.dataset.state = 'error';
        status.textContent = 'We could not confirm delivery. Check your connection and try again later.';
      } finally {
        button.disabled = false;
        button.textContent = 'Send message';
      }
    });
  </script>
</body>
</html>
